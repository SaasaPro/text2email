<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verve Text2Email Tool</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="search-container">
    <img src="https://nms1-la.mynlv.com/ns-api/?object=image&action=read&filename=portal_main_top_left.png&server=nms1-la.mynlv.com&territory=NextLevel&domain=2000ponceowner.myvrv.com" alt="">
    <h1>Text2Email Tool</h1>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-button active" data-tab="listado">Numbers List</button>
    <button class="tab-button" data-tab="añadir">Add New Number</button>
  </div>

  <!-- Contenido de cada tab -->
  <div id="listado" class="tab-content active">
<button id="exportCsvBtn" class="export-btn" title="CSV Export" disabled>
  <svg xmlns="http://www.w3.org/2000/svg" 
       width="22" height="22" 
       viewBox="0 0 24 24" fill="white">
    <path d="M3 3h14l4 4v14H3V3zm12 2H7v4h8V5zm2 14v-6H7v6h10z"/>
  </svg>
  <span>Export</span>
</button>

    <form id="searchForm">
      <input name="search" id="search" type="search" placeholder="Search by number or email address">
    </form>
      <div id="loader" style="display:none;">
        <div class="loading-bar"></div>
      </div>
    <div id="table-wrapper">
      <div id="table-scroll"></div>
    </div>
    <div id="results"></div>
  </div>

  <div id="añadir" class="tab-content">
    <form id="phoneForm">
      <label for="providerCode">Cluster:</label>
      <select id="providerCode" name="providerCode" required>
        <option value="P001">OITC</option>
        <option value="P002">APBX</option>
        <option value="P003">Nexogy</option>
        <option value="P004">MYVRV/NLI</option>
      </select>

      <label for="phoneNumber">Phone Number:</label>
      <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Ex: 8133550115" required>

      <label for="deliveryEmailAddress">Email Address:</label>
      <input type="email" id="deliveryEmailAddress" name="deliveryEmailAddress" placeholder="sample@mail.com" required>

      <button type="submit">Add</button>
      
    </form>
    <!-- <div class="image-container">
        <img src="https://qos-orldc.myvrv.com/images/falco.png" class="falco" alt="Our lord">
    </div> -->
    <div id="result"></div>
  </div>

  <script src="app.js"></script>
  <script src="script.js"></script>
</body>
</html>
